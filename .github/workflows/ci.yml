name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Install heavy + dev together. cadquery-ocp is ~180 MB but pip's
      # cache (keyed on pyproject.toml) keeps later runs fast. The
      # parts/scad/mesh tests all touch OCP, so a light-only install
      # can't run the full test suite.
      - name: Install (heavy + dev extras)
        run: pip install -e ".[heavy,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest
