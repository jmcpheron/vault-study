[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultkit"
version = "0.1.0"
description = "Python kernel for the Vault Study repo — gear math, STEP processing, explainer-page generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jason McPheron" }]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
# Heavy: CAD libraries for STEP / mesh / render work. ~180 MB OpenCascade wheel.
heavy = [
    "cadquery-ocp>=7.7",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "drawsvg>=2.3",
]

# Dev: testing + lint. Light enough to install in CI for prose-only PRs.
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
vaultkit = "vaultkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
